services:
  cliponomicon:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        VITE_API_URL: ${API_URL:-https://cliponomicon-api-develop.luigifun.es}
    container_name: cliponomicon
    ports:
      - "${APP_PORT:-8000}:80"
    restart: unless-stopped
    networks:
      proxy_network:
        aliases:
          - ${PROXY_NETWORK_ALIAS:-cliponomicon}

    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false

networks:
  proxy_network:
    external: true
    name: ${PROXY_NETWORK_NAME:-caddy}
